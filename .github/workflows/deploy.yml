name: Deploy to Vercel

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_API_ADAPTER: supabase
          VITE_APP_VERSION: ${{ github.sha }}

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./

# Required GitHub Secrets (Settings → Secrets → Actions):
#   VERCEL_TOKEN         — from vercel.com → Account Settings → Tokens
#   VERCEL_ORG_ID        — from vercel.com → team settings
#   VERCEL_PROJECT_ID    — from vercel.com → project settings
#   VITE_SUPABASE_URL    — from supabase.com → project API settings
#   VITE_SUPABASE_ANON_KEY — from supabase.com → project API settings
